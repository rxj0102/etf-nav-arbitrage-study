    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "plotly==6.8.0",
    "pillow==12.2.0",
    "streamlit==1.58.0",
    "reportlab==4.5.1",
    "APScheduler==3.11.2",
